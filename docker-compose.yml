version: "3.9"

services:
  vision-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indra-vision-service
    command: uvicorn src.vision_service.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indra-agent-copilot
    command: uvicorn src.agent_service.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env.example
    environment:
      - VISION_SERVICE_URL=http://vision-service:8000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./docs:/app/docs
    depends_on:
      vision-service:
        condition: service_healthy
